name: Refresh SPA Control Tower

on:
  schedule:
    - cron: '30 2 * * *'   # 8:30 AM BDT daily (T-1 data)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pymssql google-auth requests

      - name: Build tower
        env:
          DWH_SERVER: ${{ secrets.DWH_SERVER }}
          DWH_USER: ${{ secrets.DWH_USER }}
          DWH_PASSWORD: ${{ secrets.DWH_PASSWORD }}
        run: python build.py

      - name: Commit refresh
        shell: bash
        run: |
          git config user.name "SPA Tower Bot"
          git config user.email "bot@akijresource.com"
          git add index.html
          if git diff --cached --quiet; then echo "No change"; else git commit -m "Auto-refresh T-1 data"; git push; fi