name: Refresh SPA Control Tower

on:
  schedule:
    - cron: '30 2 * * *'   # 8:30 AM BDT daily (T-1 data)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Decode Sheets service account
        run: echo "${{ secrets.SHEETS_SA_JSON }}" | base64 -d > "${{ runner.temp }}/sa.json"

      - name: Build tower
        env:
          DWH_SERVER: ${{ secrets.DWH_SERVER }}
          DWH_USER: ${{ secrets.DWH_USER }}
          DWH_PASSWORD: ${{ secrets.DWH_PASSWORD }}
          SHEETS_SA_PATH: ${{ runner.temp }}/sa.json
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet pymssql google-auth requests
          python build.py

      - name: Commit refresh
        run: |
          git config user.name "SPA Tower Bot"
          git config user.email "bot@akijresource.com"
          git add index.html
          if git diff --cached --quiet; then echo "No change"; else git commit -m "Auto-refresh T-1 data"; git push; fi